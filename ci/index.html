<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI Pigment Lookup | PMU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;700;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(157,220,255,0.6) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 10%, rgba(254,135,253,0.5) 0%, transparent 45%),
    radial-gradient(ellipse at 60% 80%, rgba(101,118,234,0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 10% 80%, rgba(193,207,252,0.6) 0%, transparent 45%),
    linear-gradient(135deg, #b8eeff 0%, #d4caff 35%, #ffc6fd 65%, #9DB8FF 100%);
  font-family: 'Nunito', 'Space Mono', monospace;
  color: #fff;
  overflow-x: hidden;
}
.bubble {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
  backdrop-filter: blur(2px);
  border: 1px solid rgba(255,255,255,0.4);
}
.b1 { width: 280px; height: 280px; top: -80px; left: -60px; }
.b2 { width: 200px; height: 200px; top: 30%; right: -60px; }
.b3 { width: 150px; height: 150px; bottom: 10%; left: 10%; }
.b4 { width: 100px; height: 100px; top: 60%; right: 20%; }

.wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 60px 24px 48px;
}

/* ヘッダー */
.header { text-align: center; margin-bottom: 36px; }
.header-sub {
  font-size: 9px; letter-spacing: 6px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 10px; text-transform: uppercase;
  font-family: 'Space Mono', monospace;
}
h1 {
  font-size: clamp(26px, 7vw, 48px); font-weight: 900;
  line-height: 1.05; margin-bottom: 6px;
  color: #fff;
  text-shadow: 0 2px 20px rgba(101,118,234,0.4), 0 0 40px rgba(254,135,253,0.3);
  letter-spacing: -1px;
}
h1 em {
  font-style: italic; font-weight: 900;
  background: linear-gradient(90deg, #fff 0%, #c1cffc 50%, #fe87fd 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-count {
  font-size: 9px; color: rgba(255,255,255,0.6); letter-spacing: 3px;
  margin-top: 10px; font-family: 'Space Mono', monospace;
}

/* 検索 */
.search-wrap { width: 100%; max-width: 480px; margin-bottom: 40px; }
.search-label {
  text-align: center; font-size: 10px; letter-spacing: 3px;
  color: rgba(255,255,255,0.7); margin-bottom: 12px;
  font-family: 'Space Mono', monospace;
}
.input-row { position: relative; }
.ci-prefix {
  position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: #6576EA; letter-spacing: 2px; font-weight: 700;
  pointer-events: none; font-family: 'Space Mono', monospace;
}
input {
  width: 100%;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(16px);
  border: 2px solid rgba(255,255,255,0.6);
  border-radius: 16px;
  color: #3a3a6a; font-family: 'Space Mono', monospace; font-size: 22px;
  padding: 16px 56px 16px 52px; outline: none; letter-spacing: 4px;
  box-shadow: 0 8px 32px rgba(101,118,234,0.15), inset 0 1px 0 rgba(255,255,255,0.5);
  transition: all 0.2s;
}
input::placeholder { color: rgba(101,118,234,0.4); }
input:focus {
  background: rgba(255,255,255,0.5);
  border-color: rgba(255,255,255,0.9);
  box-shadow: 0 8px 40px rgba(101,118,234,0.25), inset 0 1px 0 rgba(255,255,255,0.8);
}
.search-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: linear-gradient(135deg, #FE87FD, #6576EA);
  border: none; border-radius: 12px;
  color: #fff; width: 42px; height: 42px; cursor: pointer;
  font-size: 18px; font-weight: 700;
  box-shadow: 0 4px 16px rgba(101,118,234,0.4);
  transition: all 0.2s;
}
.search-btn:hover { transform: translateY(-50%) scale(1.05); box-shadow: 0 6px 24px rgba(101,118,234,0.5); }
.search-btn:disabled {
  background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.4);
  cursor: default; box-shadow: none;
}
.hint { text-align: center; margin-top: 8px; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 2px; font-family: 'Space Mono', monospace; }

/* カード */
.result-wrap { width: 100%; max-width: 600px; }
.card {
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(20px);
  border: 1.5px solid rgba(255,255,255,0.6);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 16px 48px rgba(101,118,234,0.2), inset 0 1px 0 rgba(255,255,255,0.6);
}
.color-band {
  padding: 28px 28px 24px;
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; position: relative;
}
.color-band::after {
  content: '';
  position: absolute; bottom: 0; left: 16px; right: 16px; height: 1px;
  background: rgba(255,255,255,0.4);
}
.ci-label { font-size: 10px; letter-spacing: 4px; opacity: 0.75; margin-bottom: 6px; font-weight: 700; font-family: 'Space Mono', monospace; }
.ci-name { font-size: clamp(13px,3vw,19px); font-weight: 900; line-height: 1.3; }
.color-hex { font-size: 10px; opacity: 0.5; letter-spacing: 2px; font-family: 'Space Mono', monospace; }
.info { padding: 20px 24px; }
.color-desc { font-size: 12px; color: #5a5a9a; margin-bottom: 16px; line-height: 1.6; font-weight: 700; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9px; letter-spacing: 1px; padding: 5px 12px;
  border-radius: 20px; white-space: nowrap; font-weight: 700;
  font-family: 'Space Mono', monospace;
}
.note { border-radius: 12px; padding: 12px 16px; font-size: 10px; line-height: 1.8; font-weight: 700; }
.note-confirmed { background: rgba(254,135,253,0.15); border: 1px solid rgba(254,135,253,0.4); color: #9a3a9a; }
.note-check { background: rgba(193,207,252,0.2); border: 1px solid rgba(101,118,234,0.3); color: #4a5aaa; }
.note-clear { background: rgba(157,220,255,0.2); border: 1px solid rgba(101,170,234,0.3); color: #3a7aaa; }
.not-found {
  background: rgba(255,255,255,0.2); backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 20px; padding: 28px; text-align: center;
  font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
}
.loading {
  background: rgba(255,255,255,0.2); backdrop-filter: blur(16px);
  border: 1.5px solid rgba(254,135,253,0.5);
  border-radius: 20px; padding: 28px; text-align: center;
  font-size: 10px; color: #9a4aaa; letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.legend-toggle {
  margin-top: 16px; display: block; width: 100%; text-align: center;
  background: transparent; border: none;
  color: rgba(255,255,255,0.4); font-size: 9px; letter-spacing: 2px;
  cursor: pointer; font-family: 'Space Mono', monospace; padding: 6px;
  transition: color 0.2s;
}
.legend-toggle:hover { color: rgba(255,255,255,0.8); }
.legend {
  margin-top: 10px;
  background: rgba(255,255,255,0.25); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.4); border-radius: 16px; padding: 16px 20px;
}
.legend-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 10px; color: #4a4a7a; font-weight: 700; }
.legend-ref {
  font-size: 9px; color: rgba(101,118,234,0.6); margin-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.3); padding-top: 8px; line-height: 1.8;
  font-family: 'Space Mono', monospace;
}

.ai-badge { font-size: 8px; color: #7a7aaa; letter-spacing: 1px; padding: 3px 8px; background: rgba(193,207,252,0.3); border: 1px solid rgba(101,118,234,0.3); border-radius: 10px; }

/* フッター */
footer {
  margin-top: auto; padding-top: 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.credit {
  display: flex; align-items: center; gap: 10px;
  font-size: 10px; color: rgba(255,255,255,0.7); letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
}
.credit-name { color: #fff; font-weight: 700; }
.ig-link {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; text-decoration: none;
  background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  box-shadow: 0 2px 8px rgba(220,39,67,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}
.ig-link:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(220,39,67,0.5); }
.ig-link svg { width: 18px; height: 18px; fill: #fff; }
.ref { font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 2px; font-family: 'Space Mono', monospace; }
</style>
</head>

モノアゾ系。CLP分類確認推奨"}, "CI 12475": {"name": "ピグメントレッド170", "color": "#CC2222", "colorName": "黄色みのある赤（ナフトールAS系）", "type": "有機", "eu_status": "check", "note": "ナフトールAS系モノアゾ顔料。CLP分類を確認のこと"}, "CI 12477": {"name": "ピグメントレッド210", "color": "#CC3344", "colorName": "高発色・青みがかった赤", "type": "有機", "eu_status": "check", "note": "ナフトール系（CAS 61932-63-6）。PMUインク用途での使用実績あり。CLP分類確認推奨"}, "CI 12485": {"name": "ピグメントレッド146", "color": "#C41E3A", "colorName": "やや黄みがかった赤", "type": "有機", "eu_status": "check", "note": "ナフトールAS系。CLP分類確認推奨"}, "CI 12466": {"name": "ピグメントレッド269", "color": "#5C0A2A", "colorName": "強い青みのある赤", "type": "有機", "eu_status": "check", "note": "ナフトール系。CLP分類確認推奨"}, "CI 12474": {"name": "ピグメントレッド266", "color": "#6B0A14", "colorName": "深みのある赤", "type": "有機", "eu_status": "check", "note": "ナフトール系。CLP分類確認推奨"}, "CI 12315": {"name": "ピグメントレッド22（Brilliant Fast Scarlet）", "color": "#8B1020", "colorName": "暗めの赤", "type": "有機", "eu_status": "check", "note": "モノアゾ系。CLP分類確認推奨"}, "CI 15850": {"name": "ピグメントレッド57（リソールルビンBCA）", "color": "#C2185B", "colorName": "青みがかった鮮明な赤・透明感", "type": "有機", "eu_status": "confirmed", "note": "EU化粧品規制Annex IVで条件付き許可だが、タトゥー・PMU用途ではAnnex IVの条件（粘膜・眼周囲不可）に該当しREACH Entry 75の規制対象。広くPMU業界で使用禁止と認識されている"}, "CI 56110": {"name": "ピグメントレッド254（DPP顔料）", "color": "#E82020", "colorName": "非常に鮮明な黄みの赤", "type": "有機", "eu_status": "check", "note": "ジケトピロロピロール（DPP）系。高耐候性・高耐熱性顔料。CLP分類確認推奨"}, "CI 73360": {"name": "Pigment Red 181 / D&C Red No.30 / 赤色226号", "color": "#C8306A", "colorName": "深みのあるピンク〜赤（Lakeは淡いシェード）", "type": "有機", "eu_status": "check", "note": "チオインジゴイド系有機顔料（CAS 2379-74-0）。EU化粧品規制Annex IV収載（全化粧品に使用可、眼周囲は不可）。日本では赤色226号として許可。タトゥー・PMU用途での皮膚内注入はAnnex IVの想定外用途のためREACH Entry 75との関係を個別確認のこと"}, "CI 73915": {"name": "ピグメントレッド122（キナクリドンマゼンタ）", "color": "#E03060", "colorName": "鮮やかなマゼンタ（ピンク～赤）", "type": "有機", "eu_status": "check", "note": "キナクリドン系（CAS 980-26-7）。化粧品・PMU用途での使用実績あり。CLP分類確認推奨"}, "CI 56300": {"name": "ピグメントイエロー138（キノフタロン）", "color": "#D4C000", "colorName": "鮮明な黄色", "type": "有機", "eu_status": "check", "note": "キノフタロン系。CLP分類確認推奨"}, "CI 56130": {"name": "ピグメントレッド264", "color": "#C01030", "colorName": "鮮明な赤", "type": "有機", "eu_status": "check", "note": "DPP系。CLP分類確認推奨"}, "CI 71105": {"name": "ピグメントオレンジ43（バットオレンジ7）", "color": "#D45000", "colorName": "オレンジ", "type": "有機", "eu_status": "check", "note": "EU化粧品規制Annex IVで粘膜（唇・目）への使用制限あり。PMU部位に注意"}, "CI 200310": {"name": "ピグメントイエロー155（PY155）", "color": "#D4C820", "colorName": "高耐候性の黄色", "type": "有機", "eu_status": "check", "note": "ビスアセトアセトアリーリド系（CAS 68516-73-4）。工業用途主体。PMUインクでのCLP分類確認推奨"}, "CI 51319": {"name": "ピグメントバイオレット23", "color": "#4A1A6B", "colorName": "青みがかった紫", "type": "有機", "eu_status": "check", "note": "ジオキサジン系。CLP分類確認推奨"}, "CI 75470": {"name": "カルミン（コチニール）/ Natural Red 4", "color": "#960018", "colorName": "カーマイン", "type": "有機", "eu_status": "check", "note": "天然色素。EU化粧品規制Annex IVで条件付き許可。アレルギーリスク（コチニールアレルギー）あり。タトゥー用途でのリスク要確認"}};
const EU_STATUS = {
  confirmed: { label: "EU規制対象（確認済）", color: "#FE87FD", icon: "●", desc: "REACH Annex XVII Entry 75で明示確認" },
  check:     { label: "要確認",               color: "#6576EA", icon: "◐", desc: "CLP分類・PAH値・使用部位等により対象になりうる" },
  clear:     { label: "EU規制外",             color: "#9DDCFF", icon: "○", desc: "Annex IV許可着色料等、規制対象外と確認" }
};
let legendVisible = false;
document.getElementById('count-label').textContent = Object.keys(DB).length + ' CI · EU REACH 2022';

function normalizeCI(v) {
  const c = v.trim().replace(/\s+/g,'');
  const num = c.replace(/^[Cc][Ii]/i,'');
  return /^\d+$/.test(num) ? 'CI ' + num : 'CI ' + c;
}
function getContrast(hex) {
  if (!hex || hex.length < 7) return '#fff';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#3a3a6a' : '#ffffff';
}
const inp = document.getElementById('ci-input');
const btn = document.getElementById('search-btn');
const resultArea = document.getElementById('result-area');
const legendArea = document.getElementById('legend-area');

inp.addEventListener('input', () => {
  inp.value = inp.value.replace(/[^0-9]/g,'');
  btn.disabled = !inp.value.trim();
});
inp.addEventListener('keydown', e => { if(e.key==='Enter') search(); });
btn.addEventListener('click', search);

async function search() {
  const raw = inp.value.trim();
  if (!raw) return;
  const ci = normalizeCI(raw);
  if (DB[ci]) { renderResult(ci, DB[ci], false); renderLegend(); return; }
  resultArea.innerHTML = '<div class="loading">&#9658; AIで解析中...</div>';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 1000,
        system: '顔料専門家。CIナンバー情報をJSONのみで返す（マークダウン不可）:\n{"name":"正式名称","color":"#RRGGBB","colorName":"色の特徴","type":"無機 or 有機","eu_status":"confirmed or check or clear","note":"EU規制状況の根拠","found":true/false}\n不明はfound:false。',
        messages: [{role:'user', content: ci + 'の情報を教えてください。'}]
      })
    });
    const data = await resp.json();
    const text = data.content?.find(b=>b.type==='text')?.text || '';
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    if (parsed.found === false) {
      resultArea.innerHTML = '<div class="not-found">' + ci + ' — データなし</div>';
    } else { renderResult(ci, parsed, true); }
  } catch(e) {
    resultArea.innerHTML = '<div class="not-found">' + ci + ' — データなし</div>';
  }
  renderLegend();
}

function renderResult(ci, d, fromAI) {
  const s = EU_STATUS[d.eu_status] || EU_STATUS.check;
  const typeColor = d.type === '有機' ? '#FE87FD' : '#9DDCFF';
  const contrast = getContrast(d.color);
  const noteClass = 'note note-' + (d.eu_status || 'check');
  resultArea.innerHTML =
    '<div class="card">' +
      '<div class="color-band" style="background:' + (d.color||'rgba(193,207,252,0.5)') + '">' +
        '<div>' +
          '<div class="ci-label" style="color:' + contrast + '">' + ci + '</div>' +
          '<div class="ci-name" style="color:' + contrast + '">' + (d.name||'') + '</div>' +
        '</div>' +
        '<div class="color-hex" style="color:' + contrast + '">' + (d.color||'') + '</div>' +
      '</div>' +
      '<div class="info">' +
        '<div class="color-desc">' + (d.colorName||'') + '</div>' +
        '<div class="badges">' +
          '<span class="badge" style="background:' + typeColor + '25;border:1.5px solid ' + typeColor + '55;color:' + (d.type==='有機'?'#8a3a9a':'#3a7aaa') + '">' + (d.type||'') + '</span>' +
          '<span class="badge" style="background:' + s.color + '20;border:1.5px solid ' + s.color + '55;color:' + (d.eu_status==='confirmed'?'#8a3a9a':d.eu_status==='clear'?'#3a7aaa':'#4a5aaa') + '">' + s.icon + ' ' + s.label + '</span>' +
          (fromAI ? '<span class="ai-badge">AI解析</span>' : '') +
        '</div>' +
        (d.note ? '<div class="' + noteClass + '">' + d.note + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<button class="legend-toggle" onclick="toggleLegend()">&#9660; 規制ステータスの凡例</button>';
}

function renderLegend() {
  legendArea.innerHTML =
    '<div id="legend-box" style="display:none" class="legend">' +
    Object.entries(EU_STATUS).map(([k,s]) =>
      '<div class="legend-item"><span style="color:' + s.color + ';flex-shrink:0">' + s.icon + '</span>' +
      '<div><span style="color:' + (k==='confirmed'?'#8a3a9a':k==='clear'?'#3a7aaa':'#4a5aaa') + ';font-weight:700">' + s.label + '</span>' +
      '<span style="color:#8a8aaa;margin-left:8px;font-weight:400">' + s.desc + '</span></div></div>'
    ).join('') +
    '<div class="legend-ref">根拠: Commission Regulation (EU) 2020/2081 — REACH Annex XVII Entry 75（2022年1月4日施行）<br>実務ではサプライヤーのSDS/CoAを必ず確認してください。</div>' +
    '</div>';
}

function toggleLegend() {
  legendVisible = !legendVisible;
  const box = document.getElementById('legend-box');
  const tb = document.querySelector('.legend-toggle');
  if (box) box.style.display = legendVisible ? 'block' : 'none';
  if (tb) tb.innerHTML = legendVisible ? '&#9650; 凡例を閉じる' : '&#9660; 規制ステータスの凡例';
}
</script>
</body>
</html>
